[package]
name = "aiagents"
version = "0.1.0"
edition = "2024"
authors = ["Witold Kaminski"]
description = "Local-first AI agents for software engineering workflows"
license = "Apache-2.0"
repository = "https://github.com/witold-k/aiagents"
homepage = "https://github.com/witold-k/aiagents"
readme = "README.md"
keywords = ["ai", "llm", "code-generation", "doc-generation", "code-review", "code-repair", "code-fix"]
categories = ["command-line-utilities", "development-tools"]

[features]
default = ["signal-handling", "runtest"]
signal-handling = ["dep:ctrlc"]
runtest = ["dep:libc"]

[[bin]]
name = "aifix_runtest"
path = "src/bin/aifix_runtest.rs"
required-features = ["runtest"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
phf =  { version = "0.14", features = ["macros"] }

# -- Lossless Markdown/HTML table structure (pinned to verified upstream commit)
simplelexer = { git = "https://github.com/witold-k/simplelexer", rev = "802b7cc256383a32198686eaede6bb1e61650d2b" }

# -- LLM HTTP requests
llmhttpclient = { git = "https://github.com/witold-k/llmhttpclient", rev = "4498270d558c039bbac3df7d08a04f7c8b28b3c1" }

# -- for directory scanning
struct_extractors = { version = "0.1.0", git = "https://github.com/witold-k/struct_extractors", rev = "8e769e7ee7dfbf447ef5e3a768bd6b666d09334b" }
fsscanner = { version = "0.4.0", git = "https://github.com/witold-k/fsscanner", rev = "cb034d15865d20b5102c6ec5a12f8944e2e11058" }

# -- symbol lookup
symbol_to_source_resolver = { git = "https://github.com/witold-k/symbol_to_source_resolver", rev = "24781cb7f1b5c0b26101ce50c8921311efd8e385" }

# -- process
ctrlc = { version = "3.5.2", optional = true }
libc = { version = "0.2", optional = true }

